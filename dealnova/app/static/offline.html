<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Baba Market</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        padding: 2rem;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.8rem;
      }
      p {
        color: #cbd5f5;
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 0.65rem 1.4rem;
        background: #22c55e;
        color: #0f172a;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hors connexion</h1>
      <p>Mode lecture seulement: vous pouvez parcourir les pages deja vues, mais les actions de commande restent indisponibles.</p>
      <button id="retryBtn" type="button">Reessayer</button>
    </div>
    <script>
      (function () {
        var retryBtn = document.getElementById("retryBtn");
        if (!retryBtn) return;
        retryBtn.addEventListener("click", function () {
          window.location.reload();
        });
      })();
    </script>
  </body>
</html>
