<!-- templates/shop/promotions.html (Redirection vers modale accueil) -->
{% extends "base.html" %}
{% block title %}{{ t('BABA Market — Promotions') }}{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <div>
    <div class="spinner-border text-warning" role="status" style="width: 2.5rem; height: 2.5rem;">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">Redirection vers les promotions...</p>
    <noscript>
      <meta http-equiv="refresh" content="0; url={{ url_for('landing', open='promotions') }}">
    </noscript>
    <p style="margin-top: 1rem;">
      <a href="{{ url_for('landing', open='promotions') }}" class="btn btn-warning btn-sm fw-semibold">
        Voir les promotions directement
      </a>
    </p>
  </div>
</div>
<script>
  window.location.replace("{{ url_for('landing', open='promotions') }}");
</script>
{% endblock %}
