<!-- templates/shop/home.html (Redirection vers modale accueil) -->
{% extends "base.html" %}
{% block title %}{{ t('BABA Market — Produits') }}{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <div>
    <div class="spinner-border text-success" role="status" style="width: 2.5rem; height: 2.5rem;">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">Redirection vers l'accueil...</p>
  </div>
</div>
<script>
  window.location.replace("{{ url_for('landing', open='products') }}");
</script>
{% endblock %}
