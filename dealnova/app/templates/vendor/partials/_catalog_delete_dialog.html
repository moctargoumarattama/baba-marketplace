<dialog id="catalogDeleteDialog" class="vd-choice-dialog" aria-labelledby="catalogDeleteTitle" aria-describedby="catalogDeleteDescription">
  <div class="vd-choice-panel">
    <header class="vd-choice-header"><h2 id="catalogDeleteTitle">Retirer cette offre ?</h2><button type="button" class="vd-icon-button" data-vd-close data-catalog-delete-cancel aria-label="Fermer"><i class="bi bi-x-lg" aria-hidden="true"></i></button></header>
    <p class="catalog-delete-name" data-catalog-delete-name></p>
    <p id="catalogDeleteDescription">Une offre déjà commandée sera désactivée pour conserver son historique.</p>
    <p class="catalog-delete-error" data-catalog-delete-error role="alert" hidden></p>
    <div class="catalog-delete-actions"><button type="button" class="catalog-action" data-vd-close data-catalog-delete-cancel>Annuler</button><button type="button" class="catalog-action catalog-action-danger" data-catalog-delete-confirm>Retirer</button></div>
  </div>
</dialog>
