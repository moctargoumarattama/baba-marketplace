{% from 'partials/_public_catalog_links.html' import catalog_url %}
<nav class="hub-bottom-nav" aria-label="{{ t('Navigation principale') }}">
  <a href="{{ url_for('landing') }}"><i class="bi bi-house-door" aria-hidden="true"></i><span>{{ t('Accueil') }}</span></a>
  <a href="{{ catalog_url('search') }}" {% if base_endpoint.startswith(('shops.', 'rentals.', 'public_catalog_pages.')) or base_endpoint == 'shop.product_detail' %}class="is-active" aria-current="page"{% endif %}><i class="bi bi-search" aria-hidden="true"></i><span>{{ t('Explorer') }}</span></a>
  <a href="{{ url_for('cart.view') }}"><span class="hub-bottom-icon"><i class="bi bi-bag" aria-hidden="true"></i><span class="hub-cart-badge{% if not cart_count %} d-none{% endif %}" data-cart-badge>{{ cart_count or 0 }}</span></span><span>{{ t('Panier') }}</span></a>
  <button type="button" data-hub-account data-href="{{ url_for('vendor.dashboard') if (current_user.is_authenticated and current_user.role == 'vendor') else (url_for('admin_users.admin_dashboard') if (current_user.is_authenticated and current_user.role in ['admin', 'manager']) else url_for('auth.login')) }}" {% if base_endpoint in ['auth.login', 'auth.forgot_password'] %}class="is-active"{% endif %}><i class="bi {{ 'bi-person' if current_user.is_authenticated else 'bi-shop' }}" aria-hidden="true"></i><span>{{ t('Compte' if current_user.is_authenticated else 'Vendeur') }}</span></button>
</nav>
