<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance en cours</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #f59e0b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #fff7ed 0%, var(--bg) 45%, #eef2ff 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
      padding: 1.25rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid #fcd34d;
      background: #fffbeb;
      color: #92400e;
      border-radius: 999px;
      padding: .25rem .75rem;
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: .75rem;
    }
    .logo-wrap { margin-bottom: .75rem; }
    .logo-wrap img {
      max-height: 52px;
      width: auto;
      object-fit: contain;
    }
    h1 {
      margin: .3rem 0 .35rem;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
    }
    p { margin: .3rem 0; }
    .muted { color: var(--muted); }
    .msg {
      margin-top: .85rem;
      padding: .8rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Maintenance active</div>

    {% if config.SITE_LOGO %}
      <div class="logo-wrap">
        <img src="{{ url_for('static', filename=config.SITE_LOGO) }}" alt="Logo">
      </div>
    {% endif %}

    <h1>Nous revenons bientot</h1>
    <p class="muted">Le site est temporairement indisponible pour maintenance technique.</p>
    <div class="msg">{{ maintenance.message if maintenance and maintenance.message else "Maintenance technique en cours." }}</div>
  </main>
</body>
</html>
